name: Verify and publish IPA pulmonic v0.2.61
on:
  push:
    branches: ['work/vowel-v060-20261111']
    paths:
      - 'vowel-release-v0.2.60/**'
      - 'pulmonic-bottom-trial/**'
      - 'vowel-release-v0.2.61/**'
      - '.github/workflows/vowel-v060.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-vowel-v060
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: node vowel-release-v0.2.61/verify.cjs
      - name: Ensure every pre-existing file remains unchanged
        run: |
          git diff --exit-code 74c8cd4b23348d6791d9630bd54948fa5d629a97 HEAD -- . ':!vowel-release-v0.2.60' ':!pulmonic-bottom-trial' ':!vowel-release-v0.2.61' ':!.github/workflows/vowel-v060.yml'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulmonic-v061-render-evidence
          path: audit-output/v061/
      - name: Assemble full preserved test site with new independent path
        run: |
          mkdir -p /tmp/v060-site
          rsync -a --exclude=.git --exclude=.github --exclude=node_modules --exclude=audit-output ./ /tmp/v060-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/v060-site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}vowel-release-v0.2.61/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
