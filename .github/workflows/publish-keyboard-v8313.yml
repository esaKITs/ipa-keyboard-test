name: Verify and publish IPA Keyboard v83.13
on:
  push:
    branches: [work/vowel-v060-20261111]
    paths: ['keyboard-v83-13/**', '.github/workflows/publish-keyboard-v8313.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-v8313
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1
      - run: npx playwright install chromium webkit --with-deps
      - name: Chromium and WebKit complete browser verification
        run: |
          python3 -m http.server 8765 >/tmp/ipa8313-http.log 2>&1 &
          node keyboard-v83-13/inline.cjs
          node keyboard-v83-13/gestures.cjs
          node keyboard-v83-13/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa8313-screenshots
          path: qa8313/
      - name: Preserve all existing site versions
        run: |
          mkdir public
          rsync -a --exclude=.git --exclude=.github --exclude=public --exclude=node_modules --exclude=qa8313 ./ public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}keyboard-v83-13/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm public v83.13
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL https://esakits.github.io/ipa-keyboard-test/keyboard-v83-13/ -o /tmp/v8313.html && curl -fsSL https://esakits.github.io/ipa-keyboard-test/keyboard-v83-13/chart.html -o /tmp/v8313chart.html && grep -q '83.13 IPA Keyboard TEST' /tmp/v8313.html && grep -q 'esa-inline-chart-layout' /tmp/v8313chart.html; then
              echo 'Public v83.13 confirmed'
              exit 0
            fi
            sleep 5
          done
          exit 1

