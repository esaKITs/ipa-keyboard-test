name: Build and verify isolated IPA vowel 0.2.57
on:
  push:
    paths:
      - 'tests/build-vowel-v057.py'
      - 'tests/verify-vowel-v057.cjs'
      - 'tests/verify-vowel-v057-shapes.py'
      - '.github/workflows/build-vowel-v057.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install fonttools brotli shapely
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Generate glyph polygons and independent release page
        run: python tests/build-vowel-v057.py
      - name: Browser verification (2 widths x 2 font sizes)
        run: node tests/verify-vowel-v057.cjs
      - name: Independent mathematical geometry verification
        run: python tests/verify-vowel-v057-shapes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v057-doulos-render-and-numeric-audit
          path: audit-output/v057/
      - name: Publish only if all checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vowel-release-v0.2.57/index.html vowel-release-v0.2.57/glyph-hulls.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publish independently verified IPA v0.2.57 test release'
            git push
          fi
