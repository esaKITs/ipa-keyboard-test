name: IPA vowel v0.2.53 regression audit
on:
  push:
    paths:
      - 'vowel-release-v0.2.53/**'
      - 'tests/vowel-v053-regression.cjs'
      - '.github/workflows/vowel-v053-regression.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Audit central vowel gaps at two widths and font sizes
        run: node tests/vowel-v053-regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vowel-v053-evidence
          path: audit-output/v053/
