name: Verify and publish suprasegmental and tone symbols v0.2.75
on:
  push:
    branches: ['work/vowel-v060-20261111']
    paths:
      - 'vowel-release-v0.2.75/**'
      - 'tests/verify-v075.cjs'
      - '.github/workflows/publish-v075.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-publish-v075
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install chromium --only-shell
      - name: Verify 32px matching vowel symbols and tone width at desktop and mobile
        run: node tests/verify-v075.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v075-suprasegmentals-tones-inspection
          path: audit-output/v075/
      - name: Package all releases preserving existing site
        run: |
          mkdir -p /tmp/v075-site
          rsync -a --exclude=.git --exclude=.github --exclude=node_modules --exclude=audit-output ./ /tmp/v075-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/v075-site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}vowel-release-v0.2.75/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify released HTML including both IPA font size and tone width
        run: |
          URL="https://esakits.github.io/ipa-keyboard-test/vowel-release-v0.2.75/"
          for i in $(seq 1 15); do
            if curl -fsSL "$URL" -o /tmp/v075.html && grep -q 'aria-label="バージョン0.2.75">0.2.75</span>' /tmp/v075.html && grep -q 'tonesAndWordAccents{width:410px;align-self:flex-start}' /tmp/v075.html && grep -q 'suprasegmentals tbody td.symbol,#chart #suprasegmentals tbody td.example{font-size:32px}' /tmp/v075.html; then
              echo "LIVE V073 VERIFIED: $URL"
              exit 0
            fi
            sleep 5
          done
          exit 1
