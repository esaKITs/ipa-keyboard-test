name: IPA v0.2.58 visual geometry audit
on:
  push:
    paths:
      - 'vowel-release-v0.2.58/**'
      - 'tests/verify-vowel-v058.cjs'
      - 'tests/verify-vowel-v058-shapes.py'
      - '.github/workflows/verify-vowel-v058.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - name: Check actual browser drawing
        run: node tests/verify-vowel-v058.cjs
      - name: Independent geometry and distance check
        run: python tests/verify-vowel-v058-shapes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-v058-render-and-coordinate-audit
          path: audit-output/v058/
