name: IPA v0.2.57 independent regression
on:
  push:
    paths:
      - 'tests/verify-vowel-v057-regression.cjs'
      - '.github/workflows/verify-vowel-v057-regression.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/verify-vowel-v057-regression.cjs
