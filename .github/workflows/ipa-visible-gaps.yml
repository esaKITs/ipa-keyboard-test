name: IPA actual visible gap coordinates numerical audit
on:
  push:
    paths:
      - 'tests/ipa-visible-gaps.cjs'
      - '.github/workflows/ipa-visible-gaps.yml'
  workflow_dispatch:
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/ipa-visible-gaps.cjs
