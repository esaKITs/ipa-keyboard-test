name: Verify and publish IPA Keyboard v83.15
on:
  push:
    branches: [work/vowel-v060-20261111]
    paths: ['keyboard-v83-15/**', '.github/workflows/publish-keyboard-v8315.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-v8315
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.61.1
      - run: npx playwright install chromium webkit --with-deps
      - name: Start preview server
        run: nohup python3 -m http.server 8765 >/tmp/ipa8315-http.log 2>&1 &
      - name: Verify glow strength, off, persistence, and translations
        run: node keyboard-v83-15/intensity.cjs
      - name: Verify colours, scaled glow, and gestures
        run: |
          node keyboard-v83-15/feedback.cjs
          node keyboard-v83-15/inline.cjs
          node keyboard-v83-15/gestures.cjs
      - name: Chromium and WebKit representative input and layout regression
        run: |
          for target in chromium/390 chromium/1280 webkit/390 webkit/1280; do
            TEST_CASE=$target node keyboard-v83-15/verify.cjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa8315-screenshots
          path: qa8315/
      - name: Preserve all existing site versions
        run: |
          mkdir public
          rsync -a --exclude=.git --exclude=.github --exclude=public --exclude=node_modules --exclude=qa8315 ./ public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}keyboard-v83-15/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm public v83.15
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL https://esakits.github.io/ipa-keyboard-test/keyboard-v83-15/ -o /tmp/v8315.html && curl -fsSL https://esakits.github.io/ipa-keyboard-test/keyboard-v83-15/chart.html -o /tmp/v8315chart.html && grep -q '83.15 IPA Keyboard TEST' /tmp/v8315.html && grep -q 'esa-inline-chart-layout' /tmp/v8315chart.html; then
              echo 'Public v83.15 confirmed'
              exit 0
            fi
            sleep 5
          done
          exit 1

