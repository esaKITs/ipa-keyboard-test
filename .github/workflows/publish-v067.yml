name: Verify and publish compact clicks v0.2.67
on:
  push:
    branches: ['work/vowel-v060-20261111']
    paths:
      - 'vowel-release-v0.2.67/**'
      - 'tests/verify-v067-ink.cjs'
      - '.github/workflows/publish-v067.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-publish-v067
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright pngjs
      - run: npx playwright install chromium --only-shell
      - name: Verify rendered click ink plus all five row heights against v0.2.66
        run: node tests/verify-v067-ink.cjs
      - name: Verify only intended CSS and version changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old=Path('vowel-release-v0.2.66/index.html').read_text()
          new=Path('vowel-release-v0.2.67/index.html').read_text()
          a='#chart #nonPulmonicConsonants tbody tr > :nth-child(-n+2){padding-top:6px;padding-bottom:7px;line-height:1.25;vertical-align:middle}'
          b='#chart #nonPulmonicConsonants tbody tr:last-child > td:first-child{padding-bottom:17px}'
          assert new == old.replace('0.2.66','0.2.67').replace(a, '#chart #nonPulmonicConsonants tbody tr > :nth-child(-n+2){padding-top:3px;padding-bottom:4px;line-height:1.15;vertical-align:middle}').replace(b, '#chart #nonPulmonicConsonants tbody tr:last-child > td:first-child{padding-bottom:10px}')
          assert 'aria-label="バージョン0.2.67">0.2.67</span>' in new
          print('VERSION AND SCOPE PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v067-click-ink-and-density-inspection
          path: audit-output/v067-ink/
      - name: Package versioned Pages site and preserve other releases
        run: |
          mkdir -p /tmp/ipa-v067-site
          rsync -a --exclude=.git --exclude=.github --exclude=node_modules --exclude=audit-output ./ /tmp/ipa-v067-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/ipa-v067-site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}vowel-release-v0.2.67/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Validate live URL, visible version and compact click CSS
        run: |
          URL="https://esakits.github.io/ipa-keyboard-test/vowel-release-v0.2.67/"
          for i in $(seq 1 15); do
            if curl -fsSL "$URL" -o /tmp/v067.html && grep -q 'aria-label="バージョン0.2.67">0.2.67</span>' /tmp/v067.html && grep -q 'padding-top:3px;padding-bottom:4px;line-height:1.15' /tmp/v067.html; then
              echo "LIVE V067 VERIFIED: $URL"
              exit 0
            fi
            sleep 5
          done
          exit 1
